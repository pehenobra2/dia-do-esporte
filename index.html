/* ==========================================================================
   EDITAR QUALQUER PARTIDA DO HISTÓRICO — corrige gols (quem marcou, assistência, equipe), adiciona ou remove
   gols, e (times fechados) quem jogou. As estatísticas são desfeitas e refeitas, então tudo continua batendo.
   ========================================================================== */
var editDraft = null;

// só dá pra editar partida com ids (as gravadas por versões bem antigas, sem como identificar os nomes, ficam só pra leitura)
function canEditEntry(e){
  if(!e || !e.teamAIds || !e.teamBIds) return false;
  return (e.goals||[]).every(function(g){ return !!g.scorerId; });
}

function openEditMatch(index){
  var e = state.matchHistory[index];
  if(!canEditEntry(e)) return;
  editDraft = {
    index: index,
    goals: e.goals.map(function(g){
      return { team:g.team, scorerId:g.scorerId, assistId:g.assistId||'', remainingAtGoal:(g.remainingAtGoal==null?null:g.remainingAtGoal) };
    }),
    partsA: e.teamAIds.slice(),
    partsB: e.teamBIds.slice(),
    error: ''
  };
  renderEditMatchModal();
  showModal();
}

function editCtx(e){
  var closed = e.mode==='closed';
  return {
    partsA: editDraft.partsA, partsB: editDraft.partsB,
    rosterA: closed ? closedRoster(e.teamAId) : [],
    rosterB: closed ? closedRoster(e.teamBId) : []
  };
}

// <option>s de jogadores agrupadas: o lado que recebe o gol, o adversário e os outros (goleiros fixos, quem saiu...)
function editPlayerOptions(e, team, selectedId, blankLabel){
  var closed = e.mode==='closed';
  var ownParts = team==='A' ? editDraft.partsA : editDraft.partsB;
  var oppParts = team==='A' ? editDraft.partsB : editDraft.partsA;
  var ownName = entrySideLabel(e, team), oppName = entrySideLabel(e, team==='A'?'B':'A');
  function opt(id){
    var pl = state.players[id];
    if(!pl) return '';
    return '<option value="'+id+'"'+(id===selectedId?' selected':'')+'>'+esc(pl.name)+(pl.fixedGoalkeeper?' 🧤':'')+'</option>';
  }
  var html = '<option value=""'+(!selectedId?' selected':'')+'>'+blankLabel+'</option>';
  html += '<optgroup label="'+esc(ownName)+'">'+ownParts.map(opt).join('')+'</optgroup>';
  html += '<optgroup label="'+esc(oppName)+' (adversário)">'+oppParts.map(opt).join('')+'</optgroup>';
  var inMatch = ownParts.concat(oppParts);
  var others = statsIds().filter(function(id){ return inMatch.indexOf(id)===-1; });
  if(others.length) html += '<optgroup label="Outros jogadores">'+others.map(opt).join('')+'</optgroup>';
  return html;
}

function renderEditMatchModal(){
  var d = editDraft;
  var e = state.matchHistory[d.index];
  var sheet = document.getElementById('modal-sheet');
  var prevScroll = sheet.scrollTop;
  var closed = e.mode==='closed';
  var ctx = editCtx(e);
  var nameA = entrySideLabel(e,'A'), nameB = entrySideLabel(e,'B');
  var scoreA = d.goals.filter(function(g){ return g.team==='A'; }).length;
  var scoreB = d.goals.filter(function(g){ return g.team==='B'; }).length;

  var html = modalHead('Editar partida');
  html += '<div class="edit-score"><span>'+sideEmoji(e.teamAColor)+' '+esc(nameA)+'</span><strong id="edit-score-text">'+scoreA+' × '+scoreB+'</strong><span>'+esc(nameB)+' '+sideEmoji(e.teamBColor)+'</span></div>';
  html += '<div class="waiting-note" style="margin-bottom:12px">O placar acompanha os gols. Ao salvar, as estatísticas de todo mundo são refeitas.</div>';

  if(closed){
    [['A', nameA, d.partsA, closedRoster(e.teamAId)], ['B', nameB, d.partsB, closedRoster(e.teamBId)]].forEach(function(row){
      var side = row[0], parts = row[2];
      var pool = row[3].concat(parts.filter(function(id){ return row[3].indexOf(id)===-1; })); // elenco + quem jogou mas já saiu do elenco
      var chips = pool.map(function(id){
        var off = parts.indexOf(id)===-1;
        return '<span class="chip toggle'+(off?' off':'')+'" data-edit-lineup="'+side+':'+id+'">'+esc(playerName(id))+'</span>';
      }).join('');
      html += '<div class="lineup"><div class="lineup-title">'+esc(row[1])+' — quem jogou ('+parts.length+')</div><div class="player-chips">'+chips+'</div></div>';
    });
  } else {
    html += '<div class="waiting-note">Jogaram — '+esc(nameA)+': '+d.partsA.map(playerName).map(esc).join(', ')+'.<br>'+esc(nameB)+': '+d.partsB.map(playerName).map(esc).join(', ')+'.</div>';
  }

  html += '<h2 class="section-title">Gols</h2>';
  if(!d.goals.length) html += '<div class="waiting-note" style="margin:0 0 10px">Sem gols. Use “Adicionar gol” pra registrar.</div>';
  d.goals.forEach(function(g, i){
    var own = g.scorerId ? isOwnGoal(ctx, g.team, g.scorerId) : false;
    html += '<div class="edit-goal">'+
      '<div class="edit-goal-head"><span>Gol '+(i+1)+(own?' · contra':'')+'</span><button class="edit-goal-del" data-eg-del="'+i+'">✕ Remover</button></div>'+
      '<label class="field-label">Gol pra</label>'+
      '<select class="field-select" data-eg-team="'+i+'"><option value="A"'+(g.team==='A'?' selected':'')+'>'+esc(nameA)+'</option><option value="B"'+(g.team==='B'?' selected':'')+'>'+esc(nameB)+'</option></select>'+
      '<label class="field-label">Quem marcou</label>'+
      '<select class="field-select" data-eg-scorer="'+i+'">'+editPlayerOptions(e, g.team, g.scorerId, 'Selecionar jogador…')+'</select>'+
      '<label class="field-label">Assistência</label>'+
      '<select class="field-select" data-eg-assist="'+i+'">'+editPlayerOptions(e, g.team, g.assistId, 'Sem assistência')+'</select>'+
      '</div>';
  });
  html += '<button class="btn btn-secondary btn-sm" id="eg-add">＋ Adicionar gol</button>';
  if(d.error) html += '<div class="edit-error" id="edit-error">'+esc(d.error)+'</div>';
  html += '<div class="cta-row"><button class="btn btn-primary" id="eg-save">Salvar correção</button></div>';
  html += '<div class="cta-row"><button class="btn btn-ghost" id="eg-cancel">Cancelar</button></div>';
  sheet.innerHTML = html;
  sheet.scrollTop = prevScroll;
  bindEditMatchEvents();
}

function bindEditMatchEvents(){
  var d = editDraft;
  document.getElementById('modal-close-btn').addEventListener('click', hideModal);
  document.getElementById('eg-cancel').addEventListener('click', hideModal);
  document.querySelectorAll('[data-eg-team]').forEach(function(sel){
    sel.addEventListener('change', function(){
      d.goals[parseInt(sel.getAttribute('data-eg-team'),10)].team = sel.value;
      d.error = '';
      renderEditMatchModal();
    });
  });
  document.querySelectorAll('[data-eg-scorer]').forEach(function(sel){
    sel.addEventListener('change', function(){
      d.goals[parseInt(sel.getAttribute('data-eg-scorer'),10)].scorerId = sel.value;
      d.error = '';
      renderEditMatchModal();
    });
  });
  document.querySelectorAll('[data-eg-assist]').forEach(function(sel){
    sel.addEventListener('change', function(){
      d.goals[parseInt(sel.getAttribute('data-eg-assist'),10)].assistId = sel.value;
      d.error = '';
    });
  });
  document.querySelectorAll('[data-eg-del]').forEach(function(btn){
    btn.addEventListener('click', function(){
      d.goals.splice(parseInt(btn.getAttribute('data-eg-del'),10), 1);
      d.error = '';
      renderEditMatchModal();
    });
  });
  document.getElementById('eg-add').addEventListener('click', function(){
    d.goals.push({ team:'A', scorerId:'', assistId:'', remainingAtGoal:null });
    d.error = '';
    renderEditMatchModal();
    var sheet = document.getElementById('modal-sheet');
    sheet.scrollTop = sheet.scrollHeight; // leva até o gol novo
  });
  document.querySelectorAll('[data-edit-lineup]').forEach(function(chip){
    chip.addEventListener('click', function(){
      var parts = chip.getAttribute('data-edit-lineup').split(':');
      var arr = parts[0]==='A' ? d.partsA : d.partsB;
      var i = arr.indexOf(parts[1]);
      if(i>-1){
        var used = d.goals.some(function(g){ return g.scorerId===parts[1] || g.assistId===parts[1]; });
        if(used){
          d.error = playerName(parts[1])+' tem gol ou assistência nessa partida — tire o gol antes de tirar ele de quem jogou.';
        } else {
          arr.splice(i,1); d.error = '';
        }
      } else { arr.push(parts[1]); d.error = ''; }
      renderEditMatchModal();
    });
  });
  document.getElementById('eg-save').addEventListener('click', saveEditedMatch);
}

function matchDirection(a, b){ return a>b ? 1 : (a<b ? -1 : 0); }

// resultado gravado depois de editar: pelo placar. Empate que já era empate mantém o rótulo original (quem ficou).
function resultAfterEdit(old, scoreA, scoreB, closed){
  var dir = matchDirection(scoreA, scoreB);
  if(dir>0) return 'A';
  if(dir<0) return 'B';
  if(String(old.result).indexOf('draw')===0) return old.result;
  return closed ? 'draw' : 'draw-edited';
}

// goals do histórico -> goals de uma partida em andamento (usado ao reabrir a última partida já editada)
function entryGoalsToMatchGoals(goals){
  return goals.map(function(g){
    return { team:g.team, scorerId:g.scorerId, assistId:g.assistId||null, ownGoal:!!g.ownGoal, remainingAtGoal:(g.remainingAtGoal==null?0:g.remainingAtGoal) };
  });
}

// o snapshot de "reabrir última partida" tem uma cópia das estatísticas e do histórico de antes da última partida;
// uma edição feita depois dele precisa entrar lá também, senão reabrir desfaria a correção sem ninguém perceber
function patchSnapshotAfterEdit(index, oldEntry, newEntry){
  var snap = state.lastMatchSnapshot;
  if(!snap) return;
  if(index < snap.matchHistory.length){
    applyEntryStats(oldEntry, snap.players, -1);
    applyEntryStats(newEntry, snap.players, +1);
    snap.matchHistory[index] = JSON.parse(JSON.stringify(newEntry));
  } else if(index === snap.matchHistory.length && snap.currentMatch){
    snap.currentMatch.goals = entryGoalsToMatchGoals(newEntry.goals);
    snap.currentMatch.scoreA = newEntry.scoreA;
    snap.currentMatch.scoreB = newEntry.scoreB;
  }
}

function saveEditedMatch(){
  var d = editDraft;
  var idx = d.index;
  var old = state.matchHistory[idx];
  if(!old) return;
  var closed = old.mode==='closed';

  for(var i=0;i<d.goals.length;i++){
    var g = d.goals[i];
    if(!g.scorerId){ d.error = 'Escolha quem marcou o gol '+(i+1)+', ou remova esse gol.'; renderEditMatchModal(); return; }
    if(g.assistId && g.assistId===g.scorerId){ d.error = 'No gol '+(i+1)+', quem marcou não pode ser o mesmo da assistência.'; renderEditMatchModal(); return; }
  }

  var ctx = {
    partsA: d.partsA.slice(), partsB: d.partsB.slice(),
    rosterA: closed ? closedRoster(old.teamAId) : [],
    rosterB: closed ? closedRoster(old.teamBId) : []
  };
  var goals = d.goals.map(function(g){
    return { team:g.team, scorerId:g.scorerId, assistId:g.assistId||null, remainingAtGoal:g.remainingAtGoal };
  });
  goals.forEach(function(g){ g.ownGoal = isOwnGoal(ctx, g.team, g.scorerId); });
  if(closed) normalizeParticipants(ctx, goals);

  var oldCopy = JSON.parse(JSON.stringify(old));
  var ne = JSON.parse(JSON.stringify(old));
  ne.version = 2;
  ne.teamAIds = ctx.partsA; ne.teamBIds = ctx.partsB;
  ne.teamANames = ctx.partsA.map(playerName); ne.teamBNames = ctx.partsB.map(playerName);
  ne.goals = goals.map(function(g){
    return {
      team:g.team, scorerId:g.scorerId, assistId:g.assistId, ownGoal:g.ownGoal, remainingAtGoal:g.remainingAtGoal,
      scorer: playerName(g.scorerId), assist: g.assistId ? playerName(g.assistId) : null
    };
  });
  ne.scoreA = goals.filter(function(g){ return g.team==='A'; }).length;
  ne.scoreB = goals.filter(function(g){ return g.team==='B'; }).length;
  ne.result = resultAfterEdit(oldCopy, ne.scoreA, ne.scoreB, closed);
  ne.edited = true;

  applyEntryStats(oldCopy, state.players, -1);
  applyEntryStats(ne, state.players, +1);
  state.matchHistory[idx] = ne;
  var wasLast = idx === state.matchHistory.length - 1;
  var canRedo = wasLast && canEditLastMatch();
  patchSnapshotAfterEdit(idx, oldCopy, ne);
  saveState();
  editDraft = null;

  var outcomeChanged = matchDirection(oldCopy.scoreA, oldCopy.scoreB) !== matchDirection(ne.scoreA, ne.scoreB);
  if(outcomeChanged && !closed){
    showOutcomeChangedPrompt(ne, canRedo);
  } else {
    hideModal();
    renderAll();
  }
}

function describeOutcome(e){
  if(e.scoreA===e.scoreB) return 'empate';
  return 'vitória do '+entrySideLabel(e, e.scoreA>e.scoreB ? 'A' : 'B');
}

// o resultado mudou (ex.: era empate e virou vitória): a correção já está no histórico e nas estatísticas,
// mas quem sobe/desce da fila depende do resultado — na última partida dá pra refazer isso, nas antigas a fila já andou
function showOutcomeChangedPrompt(entry, canRedo){
  renderAll();
  var sheet = document.getElementById('modal-sheet');
  var html = modalHead('Resultado mudou');
  html += '<div class="modal-confirm-text">Com a correção, essa partida passa a ser '+esc(describeOutcome(entry))+' ('+entry.scoreA+' × '+entry.scoreB+'). O histórico e as estatísticas já foram atualizados.';
  if(canRedo){
    html += '<br><br>Quer refazer a fila com o resultado novo? Se sim, a partida é reaberta e concluída de novo (se for empate, você escolhe quem fica).';
    html += '</div><button class="btn btn-primary" id="outcome-redo">Refazer a fila</button>'+
      '<div class="cta-row"><button class="btn btn-ghost" id="outcome-keep">Manter a fila como está</button></div>';
  } else {
    html += '<br><br>A fila não muda, porque já teve partidas depois dessa.';
    html += '</div><button class="btn btn-secondary" id="outcome-keep">Entendi</button>';
  }
  sheet.innerHTML = html;
  showModal();
  document.getElementById('modal-close-btn').addEventListener('click', hideModal);
  document.getElementById('outcome-keep').addEventListener('click', hideModal);
  var redo = document.getElementById('outcome-redo');
  if(redo) redo.addEventListener('click', function(){
    hideModal();
    editLastMatch();                                   // volta pra logo antes do fim, já com os gols corrigidos
    if(state.currentMatch) delete state.currentMatch.reopenedForEdit;
    resolveMatchEnd();                                 // vitória: refaz a fila sozinho; empate: pergunta quem fica
  });
}

/* ==========================================================================
   RENDER ALL
   ========================================================================== */
function renderAll(){
  var tabLabel = document.querySelector('[data-tab="fila"] .tab-label');
  if(tabLabel) tabLabel.textContent = isClosed() ? 'Equipes' : 'Fila';
  renderFila();
  renderPartida();
  renderStats();
  var pulse = document.getElementById('match-pulse');
  if(state.currentMatch) pulse.classList.remove('hidden'); else pulse.classList.add('hidden');
}

/* Init */
switchTab('fila');
renderAll();
if(state.currentMatch) startTimerLoop();

})();
</script>
