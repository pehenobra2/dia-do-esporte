<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#10201C" />
<title>Fut de Terça — Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1E1A;
    --bg-2:#0C1815;
    --surface:#16302A;
    --surface-2:#1C3A32;
    --line:rgba(243,241,231,0.09);
    --text:#F3F1E7;
    --text-muted:#93A9A2;
    --gold:#E8A33D;
    --gold-dim:rgba(232,163,61,0.16);
    --teal:#3FB8A6;
    --teal-dim:rgba(63,184,166,0.16);
    --verde:#4ADE80;
    --verde-dim:rgba(74,222,128,0.16);
    --preto-dim:rgba(243,241,231,0.13);
    --red:#E2543D;
    --red-dim:rgba(226,84,61,0.16);
    --font-display:'Teko', sans-serif;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(63,184,166,0.10), transparent),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;}
  input{font-family:inherit;}
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* Header */
  header.topbar{
    padding:calc(14px + var(--safe-top)) 18px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--bg-2), transparent);
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{display:flex; flex-direction:column; line-height:1.05;}
  .brand .ball{font-size:20px; margin-right:6px;}
  .brand h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:26px;
    letter-spacing:0.3px;
    margin:0;
  }
  .brand span.sub{
    font-size:11px;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:1.4px;
    margin-top:2px;
  }
  .icon-btn{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text-muted);
    width:38px; height:38px;
    border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    cursor:pointer;
  }
  .icon-btn:active{transform:scale(0.94);}

  /* Main / screens */
  main{
    flex:1;
    padding:16px 16px calc(96px + var(--safe-bottom));
    overflow-y:auto;
  }
  .screen{display:none;}
  .screen.active{display:block; animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  h2.section-title{
    font-family:var(--font-display);
    font-size:20px;
    font-weight:600;
    letter-spacing:0.3px;
    color:var(--text-muted);
    text-transform:uppercase;
    margin:22px 0 10px;
  }
  h2.section-title:first-child{margin-top:0;}

  /* Add player */
  .add-row{
    display:flex; gap:8px;
    position:sticky; top:0; z-index:10;
    padding-bottom:4px;
  }
  .add-row input{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    padding:13px 14px;
    border-radius:12px;
    font-size:16px;
    outline:none;
  }
  .add-row input:focus{border-color:var(--teal);}
  .add-row button{
    background:var(--gold);
    color:#1C1305;
    border:none;
    border-radius:12px;
    padding:0 20px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .add-row button:active{transform:scale(0.96);}

  .empty-state{
    text-align:center;
    color:var(--text-muted);
    padding:40px 20px;
    font-size:14.5px;
    line-height:1.5;
  }
  .empty-state .big{font-size:36px; display:block; margin-bottom:10px;}

  /* Team cards */
  .team-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 14px 12px;
    margin-bottom:12px;
  }
  .team-card.preto{border-color:rgba(243,241,231,0.35); box-shadow:0 0 0 1px rgba(243,241,231,0.10) inset;}
  .team-card.verde{border-color:rgba(74,222,128,0.5); box-shadow:0 0 0 1px rgba(74,222,128,0.15) inset;}
  .team-card.playing{border-color:rgba(226,84,61,0.5); box-shadow:0 0 0 1px rgba(226,84,61,0.15) inset;}
  .team-card.playing .team-dot{background:var(--red);}
  .badge.red{background:var(--red-dim); color:var(--red);}
  .team-card-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .team-label{
    display:flex; align-items:center; gap:7px;
    font-family:var(--font-display);
    font-size:19px;
    letter-spacing:0.3px;
  }
  .team-dot{width:9px; height:9px; border-radius:50%; background:var(--text-muted); flex:none;}
  .team-card.preto .team-dot{background:#141414; border:1.5px solid rgba(243,241,231,0.55);}
  .team-card.verde .team-dot{background:var(--verde);}
  .badge{
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.6px;
    padding:3px 8px;
    border-radius:999px;
  }
  .badge.gold{background:var(--gold-dim); color:var(--gold);}
  .badge.teal{background:var(--teal-dim); color:var(--teal);}
  .badge.preto{background:var(--preto-dim); color:var(--text);}
  .badge.verde{background:var(--verde-dim); color:var(--verde);}
  .player-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:9px;
    padding:7px 10px;
    font-size:14px;
    display:flex; align-items:center; gap:6px;
  }
  .chip .x{
    color:var(--text-muted);
    font-size:13px;
    cursor:pointer;
    padding:0 1px;
  }
  .chip.slot-empty{
    color:var(--text-muted);
    border-style:dashed;
    background:transparent;
  }
  .waiting-note{
    color:var(--text-muted);
    font-size:13px;
    margin-top:8px;
  }

  .cta-row{margin-top:14px;}
  .btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:15px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--gold); color:#1C1305;}
  .btn-secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--line);}
  .btn-danger{background:var(--red-dim); color:var(--red); border:1px solid rgba(226,84,61,0.3);}
  .btn-teal{background:var(--teal); color:#08211C;}
  .btn[disabled]{opacity:0.4; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--text-muted); border:1px solid var(--line);}
  .btn-sm{padding:11px; font-size:14px; border-radius:12px;}

  /* Partida screen */
  .waiting-block{text-align:center; padding:50px 16px; color:var(--text-muted);}
  .waiting-block .big{font-size:38px; display:block; margin-bottom:12px;}

  .setup-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
  }
  .goalkeeper-card{margin:14px 0 18px;}
  .vs-row{
    display:flex; align-items:center; gap:10px;
    margin-bottom:16px;
  }
  .vs-team{
    flex:1; text-align:center;
    background:var(--surface-2);
    border-radius:14px;
    padding:12px 8px;
  }
  .vs-team .tname{font-family:var(--font-display); font-size:22px;}
  .vs-team .tplayers{font-size:12.5px; color:var(--text-muted); margin-top:4px; line-height:1.4;}
  .vs-x{font-family:var(--font-display); font-size:20px; color:var(--text-muted);}

  .duration-row{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin:18px 0;
  }
  .duration-row button{
    width:40px; height:40px; border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text);
    font-size:18px;
    cursor:pointer;
  }
  .duration-display{
    font-family:var(--font-display);
    font-size:40px;
    min-width:110px;
    text-align:center;
  }
  .duration-display span{font-size:15px; color:var(--text-muted); font-family:var(--font-body);}
  .preset-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px;}
  .preset-chip{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted);
    border-radius:10px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .preset-chip.active{border-color:var(--gold); color:var(--gold); background:var(--gold-dim);}
  .preset-chip:active{transform:scale(0.96);}

  /* Scoreboard */
  .scoreboard{
    background:linear-gradient(180deg, var(--bg-2), #0A1512);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px 16px 18px;
    text-align:center;
  }
  .timer-display{
    font-family:var(--font-display);
    font-size:64px;
    letter-spacing:2px;
    line-height:1;
  }
  .timer-display.paused{color:var(--text-muted);}
  .timer-display.ending{color:var(--red);}
  .score-row{
    display:flex; align-items:center; justify-content:center; gap:18px;
    margin-top:6px;
  }
  .score-team{flex:1;}
  .score-team .tname{
    font-family:var(--font-display);
    font-size:19px;
    color:var(--text-muted);
    letter-spacing:0.3px;
  }
  .score-team .tscore{
    font-family:var(--font-display);
    font-size:52px;
    line-height:1;
  }
  .score-team.preto .tname{color:var(--text);}
  .score-team.verde .tname{color:var(--verde);}
  .score-sep{font-family:var(--font-display); font-size:30px; color:var(--text-muted); padding-top:18px;}

  .match-actions{display:flex; gap:10px; margin-top:18px;}
  .match-actions .btn{margin:0;}

  .goal-log{margin-top:16px;}
  .goal-log-item{
    display:flex; align-items:center; gap:8px;
    font-size:13.5px;
    color:var(--text-muted);
    padding:6px 2px;
    border-bottom:1px solid var(--line);
  }
  .goal-log-item:last-child{border-bottom:none;}
  .goal-log-item .who{color:var(--text); font-weight:600;}
  .goal-log-item .x{color:var(--text-muted); font-size:13px; cursor:pointer; padding:2px 4px;}
  .goal-log-item .side-dot{width:7px; height:7px; border-radius:50%; flex:none;}
  .goal-log-item .side-dot.a{background:#D9D9D9;}
  .goal-log-item .side-dot.b{background:var(--verde);}
  .undo-link{
    display:inline-block;
    margin-top:10px;
    font-size:13px;
    color:var(--text-muted);
    text-decoration:underline;
    cursor:pointer;
  }

  .result-panel{margin-top:18px;}
  .result-panel p{color:var(--text-muted); font-size:13.5px; text-align:center; margin:0 0 12px;}
  .result-btn{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:13px;
    padding:14px;
    font-size:15px;
    font-weight:700;
    margin-bottom:9px;
    cursor:pointer;
  }
  .result-btn.suggested{border-color:var(--gold); background:var(--gold-dim); color:var(--gold);}
  .result-btn:active{transform:scale(0.98);}

  /* Stats */
  .stats-summary{
    display:flex; gap:10px; margin-bottom:16px;
  }
  .stat-box{
    flex:1; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:12px; text-align:center;
  }
  .stat-box .num{font-family:var(--font-display); font-size:30px;}
  .stat-box .lab{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;}

  table.stats-table{width:100%; border-collapse:collapse; font-size:14px;}
  table.stats-table th{
    text-align:left; color:var(--text-muted); font-weight:600;
    font-size:11px; text-transform:uppercase; letter-spacing:0.4px;
    padding:8px 6px; border-bottom:1px solid var(--line);
  }
  table.stats-table th.num, table.stats-table td.num{text-align:center;}
  table.stats-table td{padding:10px 6px; border-bottom:1px solid var(--line);}
  table.stats-table tr:last-child td{border-bottom:none;}
  .rank-gold{color:var(--gold); font-weight:700;}

  .history-item{
    background:var(--surface); border:1px solid var(--line);
    border-radius:13px; padding:12px 14px; margin-bottom:10px;
    font-size:13.5px;
  }
  .history-item .h-top{display:flex; justify-content:space-between; align-items:center; font-family:var(--font-display); font-size:19px;}
  .history-item .h-goals{color:var(--text-muted); margin-top:4px; font-size:12.5px; line-height:1.5;}
  .history-item.editable{border-color:rgba(232,163,61,0.4);}

  /* Modo de jogo / times fechados */
  .mode-grid{display:flex; gap:10px; margin-bottom:18px;}
  .mode-card{
    flex:1; background:var(--surface); border:1px solid var(--line); color:var(--text);
    border-radius:16px; padding:14px 12px; text-align:left; cursor:pointer;
  }
  .mode-card:active{transform:scale(0.98);}
  .mode-card .mt{font-family:var(--font-display); font-size:21px; display:block; margin-bottom:4px; letter-spacing:0.3px;}
  .mode-card .md{font-size:12px; color:var(--text-muted); line-height:1.4; display:block;}
  .mode-card.active{border-color:var(--gold); background:var(--gold-dim);}
  .team-name-input{
    width:100%; background:var(--bg-2); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:11px; font-size:19px; font-family:var(--font-display);
    letter-spacing:0.3px; outline:none;
  }
  .team-name-input:focus{border-color:var(--teal);}
  .team-name-input.invalid{border-color:var(--red);}
  .mini-add-row{display:flex; gap:8px; margin-top:10px;}
  .mini-add-row input{
    flex:1; min-width:0; background:var(--bg-2); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:11px; font-size:15px; outline:none;
  }
  .mini-add-row input:focus{border-color:var(--teal);}
  .mini-add-row button{
    background:var(--gold); color:#1C1305; border:none; border-radius:11px;
    padding:0 14px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .team-foot{display:flex; justify-content:space-between; align-items:center; margin-top:10px;}
  .team-foot .waiting-note{margin:0;}
  .link-btn{background:none; border:none; color:var(--text-muted); font-size:12.5px; text-decoration:underline; cursor:pointer; padding:4px;}
  .warn-note{color:var(--red); font-size:13px; margin-top:10px; line-height:1.45;}
  .field-label{display:block; font-size:12.5px; color:var(--text-muted); margin:12px 0 6px;}
  .field-select{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:13px; border-radius:12px; font-size:15px; outline:none; appearance:none; -webkit-appearance:none;
  }
  .field-select:focus{border-color:var(--teal);}
  .lineup{margin-top:14px;}
  .lineup-title{font-size:12.5px; color:var(--text-muted); margin-bottom:7px;}
  .chip.toggle{cursor:pointer;}
  .chip.toggle.off{opacity:0.4; text-decoration:line-through;}
  .sub-team{display:block; font-size:11px; color:var(--text-muted); margin-top:1px;}
  .edit-score{display:flex; justify-content:space-between; align-items:center; gap:8px; font-family:var(--font-display); font-size:20px; margin-bottom:6px;}
  .edit-score strong{font-weight:600; font-size:26px;}
  .edit-goal{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:4px 12px 14px; margin-bottom:10px;}
  .edit-goal-head{display:flex; justify-content:space-between; align-items:center; padding-top:10px; font-weight:700; font-size:14px;}
  .edit-goal-del{background:none; border:none; color:var(--red); font-size:13px; cursor:pointer; padding:4px;}
  .edit-error{color:var(--red); font-size:13.5px; margin:10px 0 0; line-height:1.45;}
  .match-actions-inline{display:flex; gap:8px; margin-top:10px;}
  .match-actions-inline .btn{margin:0;}

  /* Tab bar */
  nav.tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:560px;
    margin:0 auto;
    background:rgba(15,30,26,0.92);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 8px calc(8px + var(--safe-bottom));
    z-index:30;
  }
  .tab-btn{
    flex:1;
    background:none; border:none;
    color:var(--text-muted);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 4px;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    border-radius:10px;
    position:relative;
  }
  .tab-btn .ic{font-size:20px;}
  .tab-btn.active{color:var(--gold);}
  .tab-btn .pulse{
    position:absolute; top:2px; right:22%;
    width:7px; height:7px; border-radius:50%;
    background:var(--red);
  }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,12,10,0.7);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:100;
  }
  .modal-overlay.hidden{display:none;}
  .modal-sheet{
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:22px 22px 0 0;
    width:100%; max-width:560px;
    max-height:82vh;
    overflow-y:auto;
    padding:18px 18px calc(22px + var(--safe-bottom));
  }
  .modal-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px;
  }
  .modal-head h3{font-family:var(--font-display); font-size:22px; font-weight:600; margin:0;}
  .modal-close{color:var(--text-muted); font-size:22px; background:none; border:none; cursor:pointer; padding:4px;}
  .pick-grid{display:flex; flex-direction:column; gap:8px;}
  .pick-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    border-radius:13px; padding:15px; font-size:16px; font-weight:600;
    text-align:left; cursor:pointer;
  }
  .pick-btn:active{transform:scale(0.98);}
  .pick-btn.team-a{border-color:rgba(243,241,231,0.4);}
  .pick-btn.team-b{border-color:rgba(74,222,128,0.5);}
  .pick-btn.muted{color:var(--text-muted); font-weight:500; border-style:dashed;}
  .other-player-row{margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);}
  .other-select-label{display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:7px;}
  .other-player-row select{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:13px; border-radius:12px; font-size:15px; outline:none; appearance:none;
    -webkit-appearance:none;
  }
  .other-player-row select:focus{border-color:var(--verde);}
  .modal-confirm-text{font-size:14.5px; color:var(--text-muted); line-height:1.5; margin-bottom:18px;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <h1><span class="ball">⚽</span>Fut de Terça</h1>
      <span class="sub">organizador de times</span>
    </div>
    <button class="icon-btn" id="btn-reset-session" title="Encerrar sessão">🗑</button>
  </header>

  <main>
    <section class="screen" id="screen-fila"></section>
    <section class="screen" id="screen-partida"></section>
    <section class="screen" id="screen-stats"></section>
  </main>

  <nav class="tabbar">
    <button class="tab-btn" data-tab="fila"><span class="ic">📋</span><span class="tab-label">Fila</span></button>
    <button class="tab-btn" data-tab="partida"><span class="ic">⏱️</span>Partida<span class="pulse hidden" id="match-pulse"></span></button>
    <button class="tab-btn" data-tab="stats"><span class="ic">📊</span>Estatísticas</button>
  </nav>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-sheet" id="modal-sheet"></div>
</div>

<script>
(function(){
'use strict';

/* ==========================================================================
   ESTADO / PERSISTÊNCIA (localStorage — dura só a sessão de terça, sem backend)
   ========================================================================== */
var STORAGE_KEY = 'futdeterca_session_v1';

function defaultState(){
  return {
    teamSize: 4,           // jogadores por time — configurável antes do 1º jogador entrar na fila
    players: {},          // id -> {id, name, games, goals, assists, ownGoals, wins, fixedGoalkeeper}
    arrivalsSoFar: 0,
    initialSplitDone: false,
    nextTeamNumber: 1,
    teams: [],             // [{number, players:[ids]}] fila em ordem crescente de number
    champion: null,        // {number, players:[ids]} | null
    currentMatch: null,
    matchHistory: [],
    playerOrder: [],       // ordem de cadastro dos jogadores da fila (entram nos times)
    goalkeeperOrder: [],   // ids de goleiros fixos — não entram na fila, mas marcam gol/assistência
    mode: 'rotation',      // 'rotation' (fila por chegada, quem ganha fica) | 'closed' (times fechados, campeonato/amistoso)
    closedTeams: [],       // [{id, name, players:[ids]}] — só no modo 'closed', quantidade de jogadores livre por equipe
    closedPick: { a:null, b:null, outA:[], outB:[] } // equipes escolhidas pra próxima partida (e quem ficou de fora da escalação)
  };
}

var state = loadState();

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== 'object') return defaultState();
    if(!parsed.teamSize) parsed.teamSize = 4; // sessões salvas antes desse ajuste
    if(!parsed.goalkeeperOrder) parsed.goalkeeperOrder = []; // sessões salvas antes desse ajuste
    if(!parsed.mode) parsed.mode = 'rotation';               // sessões salvas antes do modo "times fechados"
    if(!parsed.closedTeams) parsed.closedTeams = [];
    if(!parsed.closedPick) parsed.closedPick = { a:null, b:null, outA:[], outB:[] };
    if(!parsed.matchHistory) parsed.matchHistory = [];
    migrateHistoryIds(parsed);
    return parsed;
  }catch(e){
    return defaultState();
  }
}

// partidas salvas por versões antigas guardavam só nomes. Tenta recuperar os ids (só quando cada nome
// aponta pra um único jogador) pra essas partidas também poderem ser editadas. Se não der, ficam só de leitura.
function migrateHistoryIds(s){
  if(!s.players) return;
  var byName = {};
  Object.keys(s.players).forEach(function(id){
    var n = s.players[id].name;
    (byName[n] = byName[n] || []).push(id);
  });
  function idFor(n){ var a = byName[n]; return (a && a.length===1) ? a[0] : null; }
  s.matchHistory.forEach(function(e){
    if(e.teamAIds && e.teamBIds) return;
    var a = (e.teamANames||[]).map(idFor), b = (e.teamBNames||[]).map(idFor);
    if(a.indexOf(null)>-1 || b.indexOf(null)>-1) return;
    var goals = [];
    for(var i=0;i<(e.goals||[]).length;i++){
      var g = e.goals[i];
      var sid = idFor(g.scorer);
      var aid = g.assist ? idFor(g.assist) : null;
      if(!sid || (g.assist && !aid)) return;
      goals.push({ team:g.team, scorer:g.scorer, assist:g.assist||null, scorerId:sid, assistId:aid, ownGoal:!!g.ownGoal, remainingAtGoal:null });
    }
    e.teamAIds = a; e.teamBIds = b; e.goals = goals;
  });
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* localStorage indisponível: segue só na memória */ }
}

/* ==========================================================================
   LÓGICA DE FILA / TIMES
   ========================================================================== */
function uid(){
  return 'p' + Math.random().toString(36).slice(2,10);
}

function playerName(id){
  var p = state.players[id];
  return p ? p.name : '???';
}

function teamNames(team){
  if(!team) return [];
  return team.players.map(playerName);
}

function lastTeam(){
  return state.teams.length ? state.teams[state.teams.length-1] : null;
}

function fillSequential(playerId){
  var t = lastTeam();
  if(!t || t.players.length >= state.teamSize){
    t = { number: state.nextTeamNumber++, players: [] };
    state.teams.push(t);
  }
  t.players.push(playerId);
}

function getOrCreateTeamByNumber(number){
  var t = null;
  for(var i=0;i<state.teams.length;i++){ if(state.teams[i].number===number){ t=state.teams[i]; break; } }
  if(!t){
    t = { number: number, players: [] };
    state.teams.push(t);
    state.teams.sort(function(a,b){ return a.number-b.number; });
  }
  return t;
}

function assignArrival(playerId){
  if(!state.initialSplitDone && state.arrivalsSoFar < state.teamSize*2){
    var isTeam1 = (state.arrivalsSoFar % 2 === 0);
    var number = isTeam1 ? 1 : 2;
    if(number >= state.nextTeamNumber) state.nextTeamNumber = number + 1;
    var t = getOrCreateTeamByNumber(number);
    t.players.push(playerId);
    state.arrivalsSoFar++;
  } else {
    fillSequential(playerId);
    state.arrivalsSoFar++;
  }
}

function addPlayer(name){
  name = (name||'').trim();
  if(!name) return;
  var id = uid();
  state.players[id] = { id:id, name:name, games:0, goals:0, assists:0, ownGoals:0, wins:0, fixedGoalkeeper:false };
  state.playerOrder.push(id);
  assignArrival(id);
  saveState();
}

function addGoalkeeper(name){
  name = (name||'').trim();
  if(!name) return;
  var id = uid();
  state.players[id] = { id:id, name:name, games:0, goals:0, assists:0, ownGoals:0, wins:0, fixedGoalkeeper:true };
  state.goalkeeperOrder.push(id);
  saveState();
}

function removeGoalkeeper(playerId){
  var idx = state.goalkeeperOrder.indexOf(playerId);
  if(idx>-1){
    state.goalkeeperOrder.splice(idx,1);
    if(isPlayerReferenced(playerId)){
      state.players[playerId].removed = true; // já tem jogo/gol registrado: sai da lista de goleiros, mas fica nas estatísticas
    } else {
      delete state.players[playerId];
    }
    saveState();
    return true;
  }
  return false;
}

// todo mundo cadastrado na sessão (fila + goleiros fixos), pra oferecer no select de gol/assistência
function fullRosterIds(){
  return state.playerOrder.concat(state.goalkeeperOrder).filter(function(id){ return !!state.players[id] && !state.players[id].removed; });
}

// todo mundo que aparece nas estatísticas: quem está cadastrado + quem saiu mas já tem partida/gol registrados
function statsIds(){
  var seen = {}, out = [];
  state.playerOrder.concat(state.goalkeeperOrder).forEach(function(id){
    if(state.players[id] && !seen[id]){ seen[id] = true; out.push(id); }
  });
  Object.keys(state.players).forEach(function(id){
    if(!seen[id]){ seen[id] = true; out.push(id); }
  });
  return out;
}

// o jogador aparece em alguma estatística, no histórico ou na partida em andamento? (se sim, não pode sumir de vez)
function isPlayerReferenced(playerId){
  var p = state.players[playerId];
  if(!p) return false;
  if(p.games || p.goals || p.assists || p.ownGoals) return true;
  function inEntryLike(parts, goals){
    if(parts && parts.indexOf(playerId) > -1) return true;
    return (goals||[]).some(function(g){ return g.scorerId===playerId || g.assistId===playerId; });
  }
  var inHistory = state.matchHistory.some(function(e){
    return inEntryLike((e.teamAIds||[]).concat(e.teamBIds||[]), e.goals);
  });
  if(inHistory) return true;
  var m = state.currentMatch;
  if(m && inEntryLike(m.teamA.players.concat(m.teamB.players), m.goals)) return true;
  return false;
}

/* ==========================================================================
   MODO "TIMES FECHADOS" — equipes com nome e elenco próprio (tamanho livre, pode variar),
   pra campeonato/amistoso. Sem fila e sem "quem ganha fica": a cada partida você escolhe as duas equipes.
   ========================================================================== */
function isClosed(){ return state.mode === 'closed'; }

function tid(){ return 't' + Math.random().toString(36).slice(2,10); }

function closedTeamById(id){
  for(var i=0;i<state.closedTeams.length;i++){ if(state.closedTeams[i].id===id) return state.closedTeams[i]; }
  return null;
}

function closedRoster(teamId){
  var t = closedTeamById(teamId);
  return t ? t.players : [];
}

function closedTeamOfPlayer(playerId){
  for(var i=0;i<state.closedTeams.length;i++){
    if(state.closedTeams[i].players.indexOf(playerId) > -1) return state.closedTeams[i];
  }
  return null;
}

// só dá pra trocar de modo com a sessão zerada (nenhum jogador, nenhuma partida)
function canChangeMode(){
  return !state.playerOrder.length && !state.goalkeeperOrder.length && !state.matchHistory.length && !state.currentMatch;
}

function freshClosedPick(){ return { a:null, b:null, outA:[], outB:[] }; }

function setMode(mode){
  if(!canChangeMode()) return false;
  state.mode = mode;
  state.closedPick = freshClosedPick();
  if(mode==='closed'){
    while(state.closedTeams.length < 2) state.closedTeams.push({ id:tid(), name:'', players:[] });
  } else {
    state.closedTeams = [];
  }
  saveState();
  return true;
}

function addClosedTeam(){
  var t = { id:tid(), name:'', players:[] };
  state.closedTeams.push(t);
  saveState();
  return t;
}

function setClosedTeamName(teamId, name){
  var t = closedTeamById(teamId);
  if(!t) return;
  t.name = (name||'').replace(/\s+/g,' ').trim();
  saveState();
}

function teamHasMatches(teamId){
  if(state.currentMatch && (state.currentMatch.teamA.teamId===teamId || state.currentMatch.teamB.teamId===teamId)) return true;
  return state.matchHistory.some(function(e){ return e.teamAId===teamId || e.teamBId===teamId; });
}

// remove a equipe (e os jogadores dela, que ainda não têm nenhuma estatística). Equipe que já jogou não pode sair.
function removeClosedTeam(teamId){
  var t = closedTeamById(teamId);
  if(!t || teamHasMatches(teamId)) return false;
  t.players.slice().forEach(function(pid){ removeClosedPlayer(pid); });
  state.closedTeams = state.closedTeams.filter(function(x){ return x.id!==teamId; });
  if(state.closedPick.a===teamId) state.closedPick.a = null;
  if(state.closedPick.b===teamId) state.closedPick.b = null;
  saveState();
  return true;
}

function addClosedPlayer(teamId, name){
  name = (name||'').trim();
  var t = closedTeamById(teamId);
  if(!name || !t) return null;
  var id = uid();
  state.players[id] = { id:id, name:name, games:0, goals:0, assists:0, ownGoals:0, wins:0, fixedGoalkeeper:false };
  state.playerOrder.push(id);
  t.players.push(id);
  saveState();
  return id;
}

// tira o jogador do elenco. Se ele já jogou/marcou, continua nas estatísticas; se nunca apareceu em nada, some de vez.
function removeClosedPlayer(playerId){
  var t = closedTeamOfPlayer(playerId);
  if(t) t.players.splice(t.players.indexOf(playerId), 1);
  ['outA','outB'].forEach(function(k){
    state.closedPick[k] = (state.closedPick[k]||[]).filter(function(x){ return x!==playerId; });
  });
  if(!isPlayerReferenced(playerId)){
    delete state.players[playerId];
    var i = state.playerOrder.indexOf(playerId);
    if(i>-1) state.playerOrder.splice(i,1);
  }
  saveState();
}

function moveClosedPlayer(playerId, toTeamId){
  var from = closedTeamOfPlayer(playerId);
  var to = closedTeamById(toTeamId);
  if(!to || from===to) return false;
  if(from) from.players.splice(from.players.indexOf(playerId), 1);
  to.players.push(playerId);
  ['outA','outB'].forEach(function(k){
    state.closedPick[k] = (state.closedPick[k]||[]).filter(function(x){ return x!==playerId; });
  });
  saveState();
  return true;
}

function normName(n){ return String(n||'').trim().toLowerCase(); }

// equipes que podem ser escolhidas pra jogar: precisam de nome e de pelo menos 1 jogador
function eligibleClosedTeams(){
  return state.closedTeams.filter(function(t){ return t.name && t.players.length > 0; });
}

function duplicateClosedNames(){
  var seen = {}, dups = {};
  state.closedTeams.forEach(function(t){
    var n = normName(t.name);
    if(!n) return;
    if(seen[n]) dups[n] = true;
    seen[n] = true;
  });
  return Object.keys(dups);
}

// escalação de um lado: elenco da equipe menos quem foi desmarcado
function closedLineup(side){
  var teamId = state.closedPick[side==='A'?'a':'b'];
  var out = state.closedPick[side==='A'?'outA':'outB'] || [];
  return closedRoster(teamId).filter(function(id){ return out.indexOf(id)===-1; });
}

function closedPickProblem(){
  var p = state.closedPick;
  var ta = p.a ? closedTeamById(p.a) : null, tb = p.b ? closedTeamById(p.b) : null;
  if(!ta || !tb) return 'Escolha as duas equipes.';
  if(ta.id===tb.id) return 'Escolha duas equipes diferentes.';
  if(!ta.name || !tb.name) return 'Dê nome às duas equipes.';
  if(normName(ta.name)===normName(tb.name)) return 'As duas equipes têm o mesmo nome. Renomeie uma delas na aba Equipes.';
  if(!closedLineup('A').length || !closedLineup('B').length) return 'Cada equipe precisa de pelo menos 1 jogador na escalação.';
  return null;
}

/* ==========================================================================
   ESTATÍSTICAS DERIVADAS DO HISTÓRICO — cada partida guarda ids de quem jogou e de todos os gols.
   Aplicar/desfazer uma partida é simétrico, então dá pra editar qualquer partida e as estatísticas continuam certas.
   ========================================================================== */
function applyEntryStats(e, players, sign){
  function pl(id){ return players[id]; }
  var ida = e.teamAIds || [], idb = e.teamBIds || [];
  ida.concat(idb).forEach(function(id){ if(pl(id)) pl(id).games += sign; });
  (e.goals||[]).forEach(function(g){
    if(g.ownGoal){
      if(pl(g.scorerId)) pl(g.scorerId).ownGoals = (pl(g.scorerId).ownGoals||0) + sign;
    } else if(pl(g.scorerId)){
      pl(g.scorerId).goals += sign;
    }
    if(g.assistId && pl(g.assistId)) pl(g.assistId).assists += sign;
  });
  var winners = e.result==='A' ? ida : (e.result==='B' ? idb : null);
  if(winners) winners.forEach(function(id){ if(pl(id)) pl(id).wins += sign; });
}

function buildHistoryEntry(m, result){
  var closed = m.mode === 'closed';
  return {
    version: 2,
    mode: closed ? 'closed' : 'rotation',
    teamANumber: m.teamA.number, teamBNumber: m.teamB.number,
    teamAColor: m.teamA.color, teamBColor: m.teamB.color,
    teamAId: closed ? m.teamA.teamId : null, teamBId: closed ? m.teamB.teamId : null,
    teamAName: closed ? sideLabel(m.teamA) : null, teamBName: closed ? sideLabel(m.teamB) : null,
    teamAIds: m.teamA.players.slice(), teamBIds: m.teamB.players.slice(),
    teamANames: m.teamA.players.map(playerName),
    teamBNames: m.teamB.players.map(playerName),
    scoreA: m.scoreA, scoreB: m.scoreB, result: result,
    goals: m.goals.map(function(g){
      return {
        team: g.team, scorerId: g.scorerId, assistId: g.assistId || null, ownGoal: !!g.ownGoal,
        remainingAtGoal: g.remainingAtGoal == null ? null : g.remainingAtGoal,
        scorer: playerName(g.scorerId), assist: g.assistId ? playerName(g.assistId) : null
      };
    }),
    endedAt: Date.now()
  };
}

// contexto de quem é de qual lado: usado pra detectar gol contra, tanto na partida ao vivo quanto na edição
function ctxFromMatch(m){
  var closed = m.mode === 'closed';
  return {
    partsA: m.teamA.players, partsB: m.teamB.players,
    rosterA: closed ? closedRoster(m.teamA.teamId) : [],
    rosterB: closed ? closedRoster(m.teamB.teamId) : []
  };
}

// o gol é "para" a equipe `team`; se quem marcou é do outro lado, é gol contra
function isOwnGoal(ctx, team, scorerId){
  var own = team==='A' ? ctx.partsA : ctx.partsB;
  var opp = team==='A' ? ctx.partsB : ctx.partsA;
  var oppRoster = team==='A' ? ctx.rosterB : ctx.rosterA;
  if(own.indexOf(scorerId) > -1) return false;
  return opp.indexOf(scorerId) > -1 || oppRoster.indexOf(scorerId) > -1;
}

// nos times fechados, quem marca/assiste e é do elenco mas não estava na escalação entra na lista de quem jogou
function normalizeParticipants(ctx, goals){
  function ensure(side, id){
    var parts = side==='A' ? ctx.partsA : ctx.partsB;
    var roster = side==='A' ? ctx.rosterA : ctx.rosterB;
    if(id && parts.indexOf(id)===-1 && roster.indexOf(id) > -1) parts.push(id);
  }
  goals.forEach(function(g){
    var opp = g.team==='A' ? 'B' : 'A';
    if(g.ownGoal) ensure(opp, g.scorerId); else ensure(g.team, g.scorerId);
    if(g.assistId) ensure(g.team, g.assistId);
  });
}

function removePlayerFromQueue(playerId){
  // só remove se ele estiver esperando (não pode remover de partida em andamento)
  for(var i=0;i<state.teams.length;i++){
    var idx = state.teams[i].players.indexOf(playerId);
    if(idx>-1){
      state.teams[i].players.splice(idx,1);
      rebuildQueueFromFlat(flattenQueue()); // recompacta a fila — quem vem atrás sobe pra cobrir a vaga, em cascata
      saveState();
      return true;
    }
  }
  if(state.champion){
    var cidx = state.champion.players.indexOf(playerId);
    if(cidx>-1){
      state.champion.players.splice(cidx,1);
      if(state.champion.players.length===0){
        state.champion = null;
      } else {
        topUpTeamFromQueue(state.champion); // completa o time da vez puxando da frente da fila
      }
      saveState();
      return true;
    }
  }
  return false;
}

function renamePlayer(playerId, newName){
  newName = (newName||'').trim();
  if(!newName) return;
  if(state.players[playerId]) state.players[playerId].name = newName;
  saveState();
}

// achata a fila (todos os times de espera) numa lista simples de ids, na ordem
function flattenQueue(){
  var ids = [];
  state.teams.forEach(function(t){ ids = ids.concat(t.players); });
  return ids;
}

// reconstrói a fila em times de state.teamSize a partir de uma lista simples de ids
function rebuildQueueFromFlat(flatIds){
  state.teams = [];
  var i = 0;
  while(i < flatIds.length){
    state.teams.push({ number: state.nextTeamNumber++, players: flatIds.slice(i, i+state.teamSize) });
    i += state.teamSize;
  }
}

// devolve jogadores pro início da fila (mantendo a posição de quem entrou como substituto e quis manter o lugar)
function returnPlayersToFrontOfQueue(playerIds){
  if(!playerIds || !playerIds.length) return;
  var flat = flattenQueue();
  playerIds.forEach(function(id){ flat = flat.filter(function(x){ return x!==id; }); });
  flat = playerIds.concat(flat);
  rebuildQueueFromFlat(flat);
}

// puxa os N primeiros da fila (achatando e reconstruindo os times de trás pra frente, em cascata).
// devolve os ids puxados (pode ser menos que "count" se a fila não tiver gente suficiente).
function pullPlayersFromFrontOfQueue(count){
  var flat = flattenQueue();
  var pulled = flat.slice(0, count);
  rebuildQueueFromFlat(flat.slice(count));
  return pulled;
}

// completa um time (campeão, por exemplo) puxando da frente da fila até dar state.teamSize
function topUpTeamFromQueue(team){
  if(!team) return;
  var missing = state.teamSize - team.players.length;
  if(missing <= 0) return;
  var pulled = pullPlayersFromFrontOfQueue(missing);
  team.players = team.players.concat(pulled);
}

// remove um jogador que está jogando a partida atual e traz o primeiro da fila como substituto,
// cascateando os times de trás pra frente pra ninguém ficar incompleto à toa
function removeFromActiveMatch(playerId){
  var m = state.currentMatch;
  if(!m) return null;
  var teamKey = null;
  if(m.teamA.players.indexOf(playerId) > -1) teamKey = 'teamA';
  else if(m.teamB.players.indexOf(playerId) > -1) teamKey = 'teamB';
  if(!teamKey) return null;

  var idx = m[teamKey].players.indexOf(playerId);
  m[teamKey].players.splice(idx, 1);

  var pulled = pullPlayersFromFrontOfQueue(1);
  var subId = pulled.length ? pulled[0] : null;
  if(subId){
    m[teamKey].players.splice(idx, 0, subId);
  }
  saveState();
  return { teamKey: teamKey, subId: subId, removedId: playerId };
}

// Retorna o próximo confronto (para tela de Fila e tela de Partida)
// texto do rótulo pra uma cor ('preto'|'verde'|null/outros -> "Time" genérico)
function colorLabel(color){
  return color==='preto' ? 'Time Preto' : (color==='verde' ? 'Time Verde' : 'Time');
}

// nome de um lado da partida: nos times fechados é o nome da equipe (sempre o atual); na fila, a cor do colete
function sideLabel(side){
  if(side && side.teamId){
    var t = closedTeamById(side.teamId);
    return (t && t.name) ? t.name : (side.name || 'Equipe');
  }
  return colorLabel(side && side.color);
}

// o mesmo, mas pra uma partida já gravada no histórico
function entrySideLabel(e, which){
  var id = which==='A' ? e.teamAId : e.teamBId;
  var nm = which==='A' ? e.teamAName : e.teamBName;
  if(id || nm){
    var t = id ? closedTeamById(id) : null;
    return (t && t.name) ? t.name : (nm || 'Equipe');
  }
  return colorLabel(which==='A' ? e.teamAColor : e.teamBColor);
}

function sideEmoji(color){ return color==='verde' ? '🟢' : '⚫'; }

function getMatchup(){
  var teamA, teamB, colorA, colorB;
  if(state.champion){
    teamA = state.champion;
    colorA = state.champion.color || 'preto';
    teamB = state.teams.length ? state.teams[0] : null;
    colorB = colorA === 'preto' ? 'verde' : 'preto';
  } else {
    teamA = state.teams.length ? state.teams[0] : null;
    teamB = state.teams.length > 1 ? state.teams[1] : null;
    colorA = 'preto';
    colorB = 'verde';
  }
  var ready = !!(teamA && teamA.players.length===state.teamSize && teamB && teamB.players.length===state.teamSize);
  return { teamA: teamA, teamB: teamB, colorA: colorA, colorB: colorB, ready: ready, hasChampion: !!state.champion };
}

function startMatch(durationMinutes){
  if(isClosed()) return startClosedMatch(durationMinutes);
  var m = getMatchup();
  if(!m.ready) return false;

  var teamA, teamB;
  if(state.champion){
    teamA = state.champion;
    teamB = state.teams.shift();
  } else {
    teamA = state.teams.shift();
    teamB = state.teams.shift();
  }
  var colorA = m.colorA, colorB = m.colorB; // captura antes de zerar o campeão
  state.initialSplitDone = true;
  state.champion = null; // liberado durante a partida; será redefinido ao final
  state.lastMatchSnapshot = null; // uma vez que uma partida nova começa, a anterior não dá mais pra corrigir

  state.currentMatch = {
    mode: 'rotation',
    teamA: { number: teamA.number, players: teamA.players.slice(), color: colorA },
    teamB: { number: teamB.number, players: teamB.players.slice(), color: colorB },
    durationSec: Math.round(durationMinutes*60),
    remainingSec: Math.round(durationMinutes*60),
    running: true,
    scoreA: 0,
    scoreB: 0,
    goals: [],
    startedAt: Date.now()
  };
  saveState();
  return true;
}

function addGoal(team, scorerId, assistId){
  var m = state.currentMatch;
  if(!m) return;
  var ctx = ctxFromMatch(m);
  var ownGoal = isOwnGoal(ctx, team, scorerId);
  if(team==='A') m.scoreA++; else m.scoreB++;
  var goal = { team:team, scorerId:scorerId, assistId:assistId||null, ownGoal:ownGoal, remainingAtGoal:m.remainingSec };
  m.goals.push(goal);
  if(m.mode==='closed') normalizeParticipants(ctx, [goal]); // quem do elenco entra em campo marcando/assistindo passa a contar como "jogou"
  saveState();
}

function removeGoalAt(index){
  var m = state.currentMatch;
  if(!m || index<0 || index>=m.goals.length) return;
  var g = m.goals[index];
  if(g.team==='A') m.scoreA--; else m.scoreB--;
  m.goals.splice(index,1);
  saveState();
}

function endMatch(result){ // 'A' | 'B' | 'draw-stay-A' | 'draw-stay-B' | 'draw-both-out'
  var m = state.currentMatch;
  if(!m) return;

  // snapshot de tudo ANTES de mexer em qualquer coisa — permite reabrir e corrigir essa partida depois
  state.lastMatchSnapshot = JSON.parse(JSON.stringify({
    players: state.players,
    teams: state.teams,
    champion: state.champion,
    currentMatch: state.currentMatch,
    matchHistory: state.matchHistory,
    playerOrder: state.playerOrder,
    goalkeeperOrder: state.goalkeeperOrder,
    arrivalsSoFar: state.arrivalsSoFar,
    initialSplitDone: state.initialSplitDone,
    nextTeamNumber: state.nextTeamNumber,
    teamSize: state.teamSize
  }));

  var winnerTeam=null, stayTeam=null, loserTeams=[];
  if(result==='A'){ winnerTeam=m.teamA; loserTeams=[m.teamB]; }
  else if(result==='B'){ winnerTeam=m.teamB; loserTeams=[m.teamA]; }
  else if(result==='draw-stay-A'){ stayTeam=m.teamA; loserTeams=[m.teamB]; }
  else if(result==='draw-stay-B'){ stayTeam=m.teamB; loserTeams=[m.teamA]; }
  else { loserTeams=[m.teamA, m.teamB]; } // 'draw-both-out': ninguém fica, os dois voltam pra fila

  // (jogos, gols, assistências e vitórias são contabilizados a partir do histórico, no fim — ver commitMatchToHistory.
  // vitória de verdade conta ponto de "vitórias"; time que só ficou por escolha no empate, não)
  var continuingTeam = winnerTeam || stayTeam;

  // substitutos que entraram no meio/fim da partida e pediram pra manter a posição na fila
  // não seguem o destino normal do time (nem viram campeões, nem vão pro fim da fila com o resto)
  var keepSpotIds = (m.keepQueueSpot || []).slice();

  if(continuingTeam){
    var championPlayers = keepSpotIds.length
      ? continuingTeam.players.filter(function(id){ return keepSpotIds.indexOf(id) === -1; })
      : continuingTeam.players.slice();
    state.champion = { number: continuingTeam.number, players: championPlayers, color: continuingTeam.color };
  } else {
    state.champion = null;
  }
  loserTeams.forEach(function(team){
    team.players.forEach(function(id){
      if(keepSpotIds.indexOf(id) > -1) return;
      fillSequential(id);
    });
  });
  // se o time que continua ficou incompleto (por causa de alguém que manteve a posição na fila),
  // completa puxando da frente da fila — em cascata — ANTES de devolver quem manteve a posição,
  // pra essa pessoa não ser puxada de volta pro mesmo time que ela acabou de optar por não seguir
  if(state.champion) topUpTeamFromQueue(state.champion);
  returnPlayersToFrontOfQueue(keepSpotIds);

  commitMatchToHistory(m, result);

  state.currentMatch = null;
  saveState();
}

// grava a partida no histórico (com ids) e soma as estatísticas dela
function commitMatchToHistory(m, result){
  var entry = buildHistoryEntry(m, result);
  applyEntryStats(entry, state.players, +1);
  state.matchHistory.push(entry);
}

// partida entre equipes fechadas: o resultado vem só do placar, sem fila e sem escolher quem sobe
function endClosedMatch(){
  var m = state.currentMatch;
  if(!m) return;
  var result = m.scoreA > m.scoreB ? 'A' : (m.scoreA < m.scoreB ? 'B' : 'draw');
  commitMatchToHistory(m, result);
  state.currentMatch = null;
  state.lastMatchSnapshot = null;
  saveState();
}

function startClosedMatch(durationMinutes){
  if(closedPickProblem()) return false;
  var p = state.closedPick;
  var ta = closedTeamById(p.a), tb = closedTeamById(p.b);
  state.currentMatch = {
    mode: 'closed',
    teamA: { number:null, teamId:ta.id, name:ta.name, players:closedLineup('A'), color:'preto' }, // cor só pra distinguir os lados na tela
    teamB: { number:null, teamId:tb.id, name:tb.name, players:closedLineup('B'), color:'verde' },
    durationSec: Math.round(durationMinutes*60),
    remainingSec: Math.round(durationMinutes*60),
    running: true,
    scoreA: 0,
    scoreB: 0,
    goals: [],
    startedAt: Date.now()
  };
  state.closedPick = freshClosedPick();
  state.lastMatchSnapshot = null;
  saveState();
  return true;
}

function resetSession(){
  state = defaultState();
  saveState();
}

// decide o fim da partida sozinho pelo placar; só precisa de decisão humana em caso de empate
function resolveMatchEnd(){
  var m = state.currentMatch;
  if(!m) return;
  if(m.mode==='closed'){
    endClosedMatch(); // times fechados: empate é só empate, não tem fila pra decidir
    renderAll();
  } else if(m.scoreA !== m.scoreB){
    endMatch(m.scoreA > m.scoreB ? 'A' : 'B');
    renderAll();
  } else {
    renderPartida();
  }
}

// só dá pra corrigir a ÚLTIMA partida concluída, e só se nenhuma partida nova já começou depois dela
// (senão os times já formados por causa daquele resultado ficariam inconsistentes)
function canEditLastMatch(){
  return !isClosed() && !!state.lastMatchSnapshot && !state.currentMatch;
}

// "volta no tempo" pra logo antes da última partida terminar, com os gols que ela tinha na hora,
// pra você corrigir usando as mesmas ferramentas de sempre (⚽ Gol, remover gol, empate) e concluir de novo
function editLastMatch(){
  if(!canEditLastMatch()) return;
  var snap = state.lastMatchSnapshot;
  snap.lastMatchSnapshot = null;
  snap.currentMatch.reopenedForEdit = true;
  state = Object.assign(defaultState(), snap, { mode:'rotation' }); // o snapshot só guarda a fila; o resto vem do padrão
  saveState();
  switchTab('partida');
}

  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderFila(){
  if(isClosed()) return renderFilaClosed();
  var el = document.getElementById('screen-fila');
  var html = '';

  var totalPlayers = state.playerOrder.length;

  if(canChangeMode()){
    html += renderModeSelector();
  }
  if(totalPlayers === 0){
    html += renderTeamSizeSetup();
  }

  html += '<div class="add-row">'+
    '<input type="text" id="input-new-player" placeholder="Nome de quem chegou..." autocomplete="off" />'+
    '<button id="btn-add-player">Adicionar</button>'+
    '</div>';

  html += renderGoalkeeperSection();

  if(totalPlayers === 0){
    html += '<div class="empty-state"><span class="big">🥅</span>Adicione o primeiro jogador que chegou na quadra.<br>A ordem de chegada define os times automaticamente.</div>';
    el.innerHTML = html;
    bindFilaEvents();
    bindTeamSizeSetupEvents();
    bindModeSelectorEvents();
    return;
  }

  if(state.currentMatch){
    var cm = state.currentMatch;
    html += '<h2 class="section-title">Em quadra agora</h2>';
    html += renderTeamCard(cm.teamA, { color: cm.teamA.color, status:'playing' });
    html += renderTeamCard(cm.teamB, { color: cm.teamB.color, status:'playing' });
    html += '<div class="waiting-note">Machucou ou precisa sair? Toque no nome — o primeiro da fila entra no lugar. Acompanhe o placar na aba Partida.</div>';

    var nextChallenger = state.teams.length ? state.teams[0] : null;
    html += '<h2 class="section-title">Próximo desafiante</h2>';
    if(nextChallenger){
      // a cor de quem desafia ainda não dá pra saber — depende de quem vencer a partida atual
      html += renderTeamCard(nextChallenger, { status:'challenger-pending' });
      if(nextChallenger.players.length < state.teamSize){
        var missingNext = state.teamSize - nextChallenger.players.length;
        html += '<div class="waiting-note">Faltam '+missingNext+' jogador'+(missingNext===1?'':'es')+' pra fechar esse time.</div>';
      } else {
        html += '<div class="waiting-note">Encara quem vencer a partida em quadra.</div>';
      }
    } else {
      html += '<div class="waiting-note">Ninguém na fila ainda pra desafiar quem vencer.</div>';
    }

    var queueRest = state.teams.slice(1);
    if(queueRest.length){
      html += '<h2 class="section-title">Fila de espera</h2>';
      queueRest.forEach(function(t){
        html += renderTeamCard(t, {});
      });
    }
  } else {
    var m = getMatchup();
    html += '<h2 class="section-title">Próxima partida <span class="badge teal" style="margin-left:6px; text-transform:none; letter-spacing:0">times de '+state.teamSize+'</span></h2>';
    html += renderTeamCard(m.teamA, { color: m.colorA, status: m.hasChampion ? 'champion' : null });
    html += renderTeamCard(m.teamB, { color: m.colorB, status:'challenger' });

    if(!m.ready){
      var have = (m.teamA?m.teamA.players.length:0) + (m.teamB?m.teamB.players.length:0);
      var missing = state.teamSize*2 - have;
      html += '<div class="waiting-note">Faltam '+missing+' jogador'+(missing===1?'':'es')+' pra fechar o próximo confronto.</div>';
    } else {
      html += '<div class="cta-row"><button class="btn btn-primary" id="btn-go-start-match">Ir pra tela de partida →</button></div>';
    }

    var queueTeams = state.teams.slice(m.hasChampion ? 1 : 2);
    if(queueTeams.length){
      html += '<h2 class="section-title">Fila de espera</h2>';
      queueTeams.forEach(function(t){
        html += renderTeamCard(t, {});
      });
    }
  }

  el.innerHTML = html;
  bindFilaEvents();
}

function setClosedTeamCount(n){
  n = Math.max(2, Math.min(16, n));
  while(state.closedTeams.length < n) addClosedTeam();
  if(state.closedTeams.length > n){
    // só tira equipes vazias do fim; se a última tem jogadores ou já jogou, pede confirmação / explica
    var last = state.closedTeams[state.closedTeams.length-1];
    if(last.players.length===0 && !teamHasMatches(last.id)){
      removeClosedTeam(last.id);
      return setClosedTeamCount(n);
    }
    requestRemoveClosedTeam(last.id);
    return false;
  }
  return true;
}

var pendingDuration = 10;

function fmtTime(totalSec){
  totalSec = Math.max(0, totalSec);
  var mm = Math.floor(totalSec/60);
  var ss = totalSec % 60;
  return (mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
}

function renderPartida(){
  var el = document.getElementById('screen-partida');
  var pulse = document.getElementById('match-pulse');
  var html = '';

  if(state.currentMatch){
    pulse.classList.remove('hidden');
    html += renderScoreboard();
  } else {
    pulse.classList.add('hidden');
    var m = isClosed() ? null : getMatchup();
    if(isClosed()){
      html += renderPartidaClosedSetup();
    } else if(!m.ready){
      html += '<div class="waiting-block"><span class="big">⏳</span>Ainda não dá pra começar.<br>Complete os dois próximos times na aba Fila.</div>';
    } else {
      html += '<h2 class="section-title">Próxima partida</h2>';
      html += '<div class="setup-card">';
      html += '<div class="vs-row">';
      html += '<div class="vs-team"><div class="tname" style="color:'+(m.colorA==='verde'?'var(--verde)':'var(--text)')+'">'+colorLabel(m.colorA)+'</div><div class="tplayers">'+teamNames(m.teamA).map(esc).join('<br>')+'</div></div>';
      html += '<div class="vs-x">×</div>';
      html += '<div class="vs-team"><div class="tname" style="color:'+(m.colorB==='verde'?'var(--verde)':'var(--text)')+'">'+colorLabel(m.colorB)+'</div><div class="tplayers">'+teamNames(m.teamB).map(esc).join('<br>')+'</div></div>';

        '<div class="duration-display" id="dur-display">'+pendingDuration+' <span>min</span></div>'+

        '</div>';

// partida entre equipes fechadas: escolhe as duas equipes (qualquer uma contra qualquer uma) e quem joga de cada lado
function renderPartidaClosedSetup(){
  var teams = eligibleClosedTeams();
  if(teams.length < 2){
    return '<div class="waiting-block"><span class="big">⏳</span>Ainda não dá pra começar.<br>Cadastre pelo menos duas equipes, cada uma com nome e jogadores, na aba Equipes.</div>';
  }
  var p = state.closedPick;
  // escolha que deixou de valer (equipe removida, renomeada pra vazio...) volta pra "selecionar"
  var elig = {}; teams.forEach(function(t){ elig[t.id] = true; });
  if(p.a && !elig[p.a]) p.a = null;
  if(p.b && !elig[p.b]) p.b = null;

  function options(selectedId, otherId){
    return '<option value="">Selecionar equipe…</option>'+teams.map(function(t){
      return '<option value="'+t.id+'"'+(t.id===selectedId?' selected':'')+(t.id===otherId?' disabled':'')+'>'+esc(t.name)+' ('+t.players.length+')</option>';
    }).join('');
  }
  var html = '<h2 class="section-title">Quem joga?</h2><div class="setup-card">';
  html += '<label class="field-label" style="margin-top:0">Equipe 1</label><select class="field-select" id="pick-team-a">'+options(p.a, p.b)+'</select>';
  html += '<label class="field-label">Equipe 2</label><select class="field-select" id="pick-team-b">'+options(p.b, p.a)+'</select>';

  function lineupBlock(side){
    var teamId = side==='A' ? p.a : p.b;
    var t = teamId ? closedTeamById(teamId) : null;
    if(!t) return '';
    var out = (side==='A' ? p.outA : p.outB) || [];
    var chips = t.players.map(function(id){
      var off = out.indexOf(id) > -1;
      return '<span class="chip toggle'+(off?' off':'')+'" data-lineup-toggle="'+side+':'+id+'">'+esc(playerName(id))+'</span>';
    }).join('');
    return '<div class="lineup"><div class="lineup-title">'+esc(t.name)+' — quem joga ('+closedLineup(side).length+' de '+t.players.length+')</div><div class="player-chips">'+chips+'</div></div>';
  }
  html += lineupBlock('A') + lineupBlock('B');
  if(p.a && p.b){
    html += '<div class="waiting-note">Toque num nome pra tirar da escalação (quem não veio). Quem entrar depois e marcar gol ou assistência é incluído automaticamente.</div>';
  }

  var problem = closedPickProblem();
  if(problem && (p.a || p.b)) html += '<div class="warn-note">'+esc(problem)+'</div>';

  html += '<div class="duration-row">'+
    '<button id="dur-minus">–</button>'+
    '<div class="duration-display" id="dur-display">'+pendingDuration+' <span>min</span></div>'+
    '<button id="dur-plus">+</button>'+
    '</div>';
  html += '<button class="btn btn-primary" id="btn-start-match"'+(problem?' disabled':'')+'>Iniciar partida</button>';
  html += '</div>';
  return html;
}

      '<div class="cta-row"><button class="btn btn-secondary btn-sm" id="btn-finish-edit">Salvar correção e concluir</button></div>';
  } else if(m.remainingSec>0){
    html += '<div class="match-actions">'+
      '<button class="btn btn-secondary" id="btn-toggle-pause">'+(m.running?'⏸ Pausar':'▶ Continuar')+'</button>'+

      '<p>Empatou! Quem vai subir?</p>'+

      '</div>';
  }

  if(m.goals.length){
    var goalItems = m.goals.map(function(g, idx){
      var scorer = playerName(g.scorerId);
      var assist = g.assistId ? ' <span style="opacity:.7">(assist. '+esc(playerName(g.assistId))+')</span>' : '';

/* ==========================================================================
   AVISO DE FIM DE PARTIDA (vibração + beep) — chama atenção quando o tempo acaba
   ========================================================================== */
var audioCtx = null;

function unlockAudio(){
  try{
    var AudioCtxClass = window.AudioContext || window.webkitAudioContext;
    if(AudioCtxClass && !audioCtx) audioCtx = new AudioCtxClass();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){ /* sem suporte a áudio — segue só com a vibração */ }
}

function notifyMatchEnd(){
  try{
    if(navigator.vibrate) navigator.vibrate([350,120,350,120,600]);
  }catch(e){ /* sem suporte a vibração (ex.: iPhone) */ }
  try{
    if(audioCtx){
      [0, 0.4, 0.8].forEach(function(t){
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.frequency.value = 880;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        var startAt = audioCtx.currentTime + t;
        gain.gain.setValueAtTime(0.0001, startAt);
        gain.gain.exponentialRampToValueAtTime(0.35, startAt + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.3);
        osc.start(startAt);
        osc.stop(startAt + 0.32);
      });
    }
  }catch(e){ /* sem suporte a áudio — segue só com a vibração */ }
}

function startTimerLoop(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(function(){
    var m = state.currentMatch;
    if(!m){ clearInterval(timerInterval); timerInterval=null; return; }
    if(m.running && m.remainingSec>0){
      m.remainingSec--;
      saveState();
      if(m.remainingSec<=0){
        m.running = false;
        notifyMatchEnd();
        resolveMatchEnd();
      } else if(currentTab==='partida'){
        var t = document.getElementById('timer-text');
        if(t){
          t.textContent = fmtTime(m.remainingSec);
          t.className = 'timer-display' + (m.remainingSec<=60?' ending':'');
        }
      }
    }
  }, 1000);
}

function handlePlayerRemovalDuringMatch(playerId){

  var teamLabel = state.currentMatch ? sideLabel(state.currentMatch[teamKey]) : 'Time';

      saveState();

/* ==========================================================================
   SANDBOX DE EDIÇÃO — toque no nome de qualquer jogador (fila, campeão ou em
   quadra) pra trocar de lugar com outro, renomear, ou remover. Um jeito
   genérico de arrumar a ordem manualmente, sem precisar de lógica específica
   pra cada situação.
   ========================================================================== */

// acha em qual array (e em que posição) um jogador está agora — fila, campeão ou partida ativa
function locatePlayer(playerId){
  for(var i=0;i<state.teams.length;i++){
    var idx = state.teams[i].players.indexOf(playerId);
    if(idx>-1) return { arr: state.teams[i].players, idx: idx };
  }
  if(state.champion){
    var cidx = state.champion.players.indexOf(playerId);
    if(cidx>-1) return { arr: state.champion.players, idx: cidx };
  }
  if(state.currentMatch){
    var aidx = state.currentMatch.teamA.players.indexOf(playerId);
    if(aidx>-1) return { arr: state.currentMatch.teamA.players, idx: aidx };
    var bidx = state.currentMatch.teamB.players.indexOf(playerId);
    if(bidx>-1) return { arr: state.currentMatch.teamB.players, idx: bidx };
  }
  return null;
}

// troca dois jogadores de posição, sejam eles de times diferentes, da fila, do campeão ou em quadra
function swapPlayers(idA, idB){
  if(idA===idB) return false;
  var locA = locatePlayer(idA);
  var locB = locatePlayer(idB);
  if(!locA || !locB) return false;
  locA.arr[locA.idx] = idB;
  locB.arr[locB.idx] = idA;
  saveState();
  return true;
}

// todo mundo que pode ser alvo de troca (fila + campeão + em quadra), na ordem em que aparecem na tela
function swapCandidateIds(excludeId){
  var ids = [];
  if(state.currentMatch){
    ids = ids.concat(state.currentMatch.teamA.players, state.currentMatch.teamB.players);
  }
  if(state.champion) ids = ids.concat(state.champion.players);
  state.teams.forEach(function(t){ ids = ids.concat(t.players); });
  var seen = {};
  return ids.filter(function(id){
    if(id===excludeId || seen[id]) return false;
    seen[id] = true;
    return true;
  });
}

  var p = state.players[playerId];

  var html = modalHead(playerName(playerId));

  if(isClosed()){

  } else if(!p.fixedGoalkeeper){

  html += '<button class="pick-btn" style="color:var(--red); border-color:rgba(226,84,61,0.35)" id="action-remove">✕ Remover</button>';
  html += '</div>';

  });

    performRemovePlayer(playerId);
  });

// tira o jogador da fila de times (igual um "remover" normal, cascateando/substituindo como precisar)
// e o transforma em goleiro fixo: some da rotação, mas continua disponível pra marcar gol/assistência
function convertToGoalkeeper(playerId){
  var p = state.players[playerId];
  if(!p || p.fixedGoalkeeper) return;

  var inActiveMatch = state.currentMatch && (
    state.currentMatch.teamA.players.indexOf(playerId) > -1 ||
    state.currentMatch.teamB.players.indexOf(playerId) > -1
  );
  if(inActiveMatch){
    handlePlayerRemovalDuringMatch(playerId); // puxa substituto e mostra o popup dele, se precisar
  } else {
    removePlayerFromQueue(playerId); // sai da fila/campeão, com a fila recompactando em cascata
  }

  p.fixedGoalkeeper = true;
  var idx = state.playerOrder.indexOf(playerId);
  if(idx>-1) state.playerOrder.splice(idx,1);
  if(state.goalkeeperOrder.indexOf(playerId)===-1) state.goalkeeperOrder.push(playerId);
  saveState();
  renderAll();
}

// times fechados: leva o jogador pra outra equipe (as estatísticas dele ficam como estão)
function openMoveTeamPicker(playerId){
  var sheet = document.getElementById('modal-sheet');
  var from = closedTeamOfPlayer(playerId);
  var html = modalHead('Mover '+esc(playerName(playerId))+' pra qual equipe?');
  html += '<div class="pick-grid">';
  state.closedTeams.forEach(function(t){
    if(from && t.id===from.id) return;
    html += '<button class="pick-btn" data-move-target="'+t.id+'">'+esc(t.name || 'Equipe sem nome')+'</button>';
  });
  html += '</div>';
  sheet.innerHTML = html;
  document.getElementById('modal-close-btn').addEventListener('click', hideModal);
  document.querySelectorAll('[data-move-target]').forEach(function(btn){
    btn.addEventListener('click', function(){
      moveClosedPlayer(playerId, btn.getAttribute('data-move-target'));
      hideModal();
      renderAll();
    });
  });
}

function openSwapTargetPicker(playerId){
  var sheet = document.getElementById('modal-sheet');
  var candidates = swapCandidateIds(playerId);
  var html = modalHead('Trocar '+esc(playerName(playerId))+' com quem?');
  if(!candidates.length){
    html += '<div class="modal-confirm-text">Não tem outro jogador em quadra ou na fila pra trocar agora.</div>';
  } else {
    html += '<div class="pick-grid">';
    candidates.forEach(function(id){
      html += '<button class="pick-btn" data-swap-target="'+id+'">'+esc(playerName(id))+'</button>';
    });
    html += '</div>';
  }
  sheet.innerHTML = html;
  var closeBtn = document.getElementById('modal-close-btn');
  if(closeBtn) closeBtn.addEventListener('click', hideModal);
  document.querySelectorAll('[data-swap-target]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var targetId = btn.getAttribute('data-swap-target');
      swapPlayers(playerId, targetId);
      hideModal();
      renderAll();
    });
  });
}

function openRenameEditor(playerId){
  var sheet = document.getElementById('modal-sheet');
  sheet.innerHTML = modalHead('Renomear')+
    '<div class="add-row"><input type="text" id="rename-input" autocomplete="off" /></div>'+
    '<button class="btn btn-primary" id="confirm-rename" style="margin-top:12px">Salvar</button>';
  var closeBtn = document.getElementById('modal-close-btn');
  if(closeBtn) closeBtn.addEventListener('click', hideModal);
  var input = document.getElementById('rename-input');
  input.value = playerName(playerId);
  input.focus();
  input.select();
  function doRename(){
    var v = input.value;
    if(v.trim()) renamePlayer(playerId, v);
    hideModal();
    renderAll();
  }
  document.getElementById('confirm-rename').addEventListener('click', doRename);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') doRename(); });
}

// remove um jogador de onde quer que ele esteja (fila, campeão, em quadra ou goleiro fixo)
function performRemovePlayer(playerId){
  if(isClosed()){
    removeClosedPlayer(playerId);
    renderAll();
    return;
  }
  var p = state.players[playerId];
  if(p && p.fixedGoalkeeper){
    removeGoalkeeper(playerId);
    renderAll();
    return;
  }
  if(state.currentMatch){
    var m = state.currentMatch;
    if(m.teamA.players.indexOf(playerId)>-1 || m.teamB.players.indexOf(playerId)>-1){
      handlePlayerRemovalDuringMatch(playerId);
      return;
    }
  }
  removePlayerFromQueue(playerId);
  renderAll();
}

/* ==========================================================================
   RENDER — Estatísticas
   ========================================================================== */
function renderStats(){
  var el = document.getElementById('screen-stats');
  var ids = statsIds();
  if(!ids.length){
    el.innerHTML = '<div class="empty-state"><span class="big">📊</span>Nenhuma estatística ainda.<br>Comece uma partida na aba Partida.</div>';
    return;
  }
  // total de gols = soma dos placares (inclui gols contra, que não entram no "G" de ninguém)
  var totalGoals = 0, totalMatches = state.matchHistory.length;
  state.matchHistory.forEach(function(m){ totalGoals += (m.scoreA||0) + (m.scoreB||0); });

  var sorted = ids.slice().sort(function(a,b){
    var pa=state.players[a], pb=state.players[b];
    if(pb.goals!==pa.goals) return pb.goals-pa.goals;
    if(pb.assists!==pa.assists) return pb.assists-pa.assists;
    return pb.wins-pa.wins;
  });

  var html = '<div class="stats-summary">'+
    '<div class="stat-box"><div class="num">'+totalMatches+'</div><div class="lab">Partidas</div></div>'+
    '<div class="stat-box"><div class="num">'+totalGoals+'</div><div class="lab">Gols</div></div>'+
    '<div class="stat-box"><div class="num">'+ids.length+'</div><div class="lab">Jogadores</div></div>'+
    '</div>';

  html += '<h2 class="section-title">Jogadores</h2>';
  html += '<table class="stats-table"><thead><tr><th>Nome</th><th class="num">J</th><th class="num">G</th><th class="num">A</th><th class="num">V</th></tr></thead><tbody>';
  sorted.forEach(function(id, i){
    var p = state.players[id];
    var name = esc(p.name) + (p.fixedGoalkeeper ? ' 🧤' : '');
    if(isClosed()){
      var t = closedTeamOfPlayer(id);
      if(t && t.name) name += '<span class="sub-team">'+esc(t.name)+'</span>';
    }
    html += '<tr><td class="'+(i===0&&p.goals>0?'rank-gold':'')+'">'+name+'</td>'+
      '<td class="num">'+p.games+'</td><td class="num">'+p.goals+'</td><td class="num">'+p.assists+'</td><td class="num">'+p.wins+'</td></tr>';
  });
  html += '</tbody></table>';

  if(state.matchHistory.length){
    html += '<h2 class="section-title">Histórico de partidas</h2>';
    var lastIdx = state.matchHistory.length - 1;
    for(var idx = lastIdx; idx >= 0; idx--){
      var m = state.matchHistory[idx];
      var emojiA = sideEmoji(m.teamAColor), emojiB = sideEmoji(m.teamBColor);
      var nameA = entrySideLabel(m,'A'), nameB = entrySideLabel(m,'B');
      var closedEntry = m.mode==='closed';
      var goalsLine = (m.goals||[]).map(function(g){
        return (g.team==='A'?emojiA:emojiB)+' '+esc(goalScorerName(g))+(g.ownGoal?' (contra)':'')+(goalAssistName(g)?' (assist. '+esc(goalAssistName(g))+')':'');
      }).join(' · ');
      var resultLabel =
        m.result==='draw-stay-A' ? 'Empate — '+nameA+' ficou' :
        m.result==='draw-stay-B' ? 'Empate — '+nameB+' ficou' :
        m.result==='draw-both-out' ? 'Empate — os dois saíram' :
        m.result==='draw' ? (closedEntry ? 'Empate' : 'Empate — os dois saíram') :
        m.result==='draw-edited' ? 'Empate (placar corrigido)' : '';
      var lastEditable = idx===lastIdx && canEditLastMatch();
      var btns = '';
      if(canEditEntry(m)) btns += '<button class="btn btn-secondary btn-sm" data-edit-match="'+idx+'">✏️ Editar partida</button>';
      if(lastEditable) btns += '<button class="btn btn-ghost btn-sm" data-edit-last-match="1">↩️ Reabrir e refazer a fila</button>';
      html += '<div class="history-item'+(lastEditable?' editable':'')+'" data-history-index="'+idx+'">'+
        '<div class="h-top"><span>'+(closedEntry?emojiA+' ':'')+esc(nameA)+'</span><span>'+m.scoreA+' × '+m.scoreB+'</span><span>'+esc(nameB)+(closedEntry?' '+emojiB:'')+'</span></div>'+
        (resultLabel? '<div class="h-goals" style="color:var(--text)">'+resultLabel+'</div>' : '')+
        (goalsLine? '<div class="h-goals">'+goalsLine+'</div>' : '<div class="h-goals">Sem gols.</div>')+
        (btns? '<div class="match-actions-inline">'+btns+'</div>' : '')+
        '</div>';
    }
  }

  el.innerHTML = html;
  bindStatsEvents();
}

// nomes de quem marcou/assistiu: sempre o nome atual do jogador (se ele foi renomeado, o histórico acompanha)
function goalScorerName(g){
  return (g.scorerId && state.players[g.scorerId]) ? state.players[g.scorerId].name : (g.scorer || '???');
}
function goalAssistName(g){
  if(!g.assistId && !g.assist) return null;
  return (g.assistId && state.players[g.assistId]) ? state.players[g.assistId].name : (g.assist || null);
}

      '<button class="btn btn-primary" id="confirm-edit-match">Reabrir partida</button>'+
